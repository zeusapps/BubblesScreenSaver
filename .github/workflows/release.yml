name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    # Lifted to job level because the secrets context is not available in a step-level `if`;
    # env is, so the signing step can gate on whether a certificate was configured.
    env:
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME -replace '^v', '' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The published release is self-contained so it runs on a machine with no .NET
          # installed. Building from source gives the lighter framework-dependent binary.
          dotnet publish src\Bubbles\Bubbles.csproj -c Release -p:Version=$env:VERSION -p:SelfContained=true -p:EnableCompressionInSingleFile=true --nologo
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item dist\Bubbles.exe artifacts\Bubbles.exe

      # Runs only when a certificate is configured. Add repository secrets
      # SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD to enable it; without them the release is
      # simply unsigned and SmartScreen warns on first run. See README, "Code signing".
      - name: Sign
        if: ${{ env.SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $cert = Get-PfxCertificate -FilePath $pfx -Password $password
            Set-AuthenticodeSignature -FilePath artifacts\Bubbles.exe -Certificate $cert -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256 | Format-List Status, StatusMessage
            $result = Get-AuthenticodeSignature artifacts\Bubbles.exe
            if ($result.Status -ne 'Valid') { throw "signing produced status $($result.Status)" }
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Checksums
        shell: pwsh
        run: |
          # The updater verifies downloads against this file, so it is generated after signing.
          Push-Location artifacts
          Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Release notes
        shell: pwsh
        run: |
          $signed = if ($env:SIGNING_PFX_BASE64) { 'yes' } else { 'no -- see the README section on code signing' }
          $fence = [string][char]96 * 3
          $lines = @(
            '**Download `Bubbles.exe` and run it.** No installer and no runtime to fetch: this',
            'build is self-contained. It has no window -- look for the artifact in the',
            'notification area, and right-click it for everything.',
            '',
            "Code signed: $signed",
            '',
            'Verify the download if you like:',
            '',
            $fence + 'powershell',
            'Get-FileHash Bubbles.exe -Algorithm SHA256',
            $fence,
            '',
            'and compare against `SHA256SUMS.txt`.',
            '',
            'The app checks this page for newer releases and stages them automatically. It never',
            'restarts itself while you are working -- the swap happens at the next launch, or when',
            'you ask for it from the tray. Turn it off with `"AutoUpdate": false` in',
            '`%APPDATA%\Bubbles\settings.json`.'
          )
          $lines | Set-Content notes.md -Encoding utf8
          Get-Content notes.md

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" artifacts\Bubbles.exe artifacts\SHA256SUMS.txt --title "v$env:VERSION" --notes-file notes.md
