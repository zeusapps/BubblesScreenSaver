name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Bubbles.sln -c Release --nologo

      - name: Test
        run: dotnet test Bubbles.sln -c Release --no-build --nologo

      - name: Render the documentation images
        run: |
          dotnet build Bubbles.sln -c Debug --nologo
          .\src\Bubbles\bin\Debug\net10.0-windows10.0.17763.0\Bubbles.exe --export docs\images

      - name: Fail if the committed images are stale
        shell: pwsh
        run: |
          # Every image in the README is produced by --export, so they must not drift from the
          # code. The render is deterministic -- the fields these images use are seeded, which
          # they were not until the drift this check is named for went unnoticed for want of an
          # exit code.
          $changed = git status --porcelain docs/images
          if ($changed) {
            Write-Host "docs/images differ after re-export:`n$changed"
            Write-Host "Re-run --export and commit the result."
            exit 1
          }
